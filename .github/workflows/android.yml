name: Android CI

on:
  push:
    branches:
      - main
      - dev
    paths-ignore:
      - '**/*.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    name: Build Release
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Accept Android SDK licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Prepare signing files
        shell: bash
        env:
          KEYSTORE_SECRET: ${{ secrets.KEYSTORE }}
          PROPERTIES_SECRET: ${{ secrets.PROP }}
        run: |
          set -euo pipefail
          mkdir -p /tmp

          if [ -n "$KEYSTORE_SECRET" ]; then
            printf '%s' "$KEYSTORE_SECRET" | base64 --decode > /tmp/xed.keystore
          else
            keytool -genkeypair \
              -v \
              -keystore /tmp/xed.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=ReTerminal, OU=Android, O=ReTerminal, L=Remote, S=NA, C=US"
          fi

          if [ -n "$PROPERTIES_SECRET" ]; then
            printf '%s' "$PROPERTIES_SECRET" | base64 --decode > /tmp/signing.properties
          else
            cat > /tmp/signing.properties <<'EOF'
keyAlias=androiddebugkey
keyPassword=android
storePassword=android
storeFile=/tmp/xed.keystore
EOF
          fi

          keytool -list -keystore /tmp/xed.keystore -storepass android >/dev/null
          ls -l /tmp/xed.keystore /tmp/signing.properties

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Download Alpine rootfs
        run: |
          mkdir -p core/main/src/main/assets
          curl -L \
            -o core/main/src/main/assets/alpine-aarch64.tar.gz.rootfs \
            https://github.com/nglam0205/ReTerminal/releases/download/ROOTFS/alpine-aarch64.tar.gz.rootfs

      - name: Set Commit Hash
        id: commit_hash
        run: echo "COMMIT_HASH=$(git rev-parse --short HEAD)" >> $GITHUB_ENV

      - name: Generate changelog
        shell: bash
        run: |
          {
            echo "## ReTerminal Release"
            echo ""
            echo "- Commit: $GITHUB_SHA"
            echo "- Branch: ${GITHUB_REF_NAME}"
            echo "- Author: ${GITHUB_ACTOR}"
            echo ""
            echo "## Changelog"
            echo ""
            LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || true)
            if [ -n "$LAST_TAG" ]; then
              echo "### Changes since $LAST_TAG"
              git log "$LAST_TAG..HEAD" --pretty=format:"- %s (%an)" || git log -n 20 --pretty=format:"- %s (%an)"
            else
              echo "### Recent commits"
              git log -n 20 --pretty=format:"- %s (%an)"
            fi
          } > changelog.md

      - name: Build with Gradle
        run: ./gradlew clean assembleRelease
        env:
          KEYSTORE_FILE: /tmp/xed.keystore
          SIGNING_PROPERTIES_FILE: /tmp/signing.properties
        continue-on-error: false

      - name: Verify APK signature
        run: apksigner verify --print-certs app/build/outputs/apk/release/*.apk

      - name: Archive APK
        uses: actions/upload-artifact@v4
        with:
          name: ReTerminal-Release
          path: app/build/outputs/apk/release/*.apk

      - name: Delete temporary signing files
        run: rm -f /tmp/xed.keystore /tmp/signing.properties

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.COMMIT_HASH }}
          name: ReTerminal ${{ env.COMMIT_HASH }}
          body_path: changelog.md
          draft: false
          prerelease: false
          files: app/build/outputs/apk/release/*.apk
