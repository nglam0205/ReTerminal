name: Android CI

on:
  push:
    branches:
      - main
      - dev
    paths-ignore:
      - '**/*.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    name: Build Release
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Accept Android SDK licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Decode and create xed.keystore
        run: |
          if [ -n "${{ secrets.KEYSTORE }}" ]; then
            echo "${{ secrets.KEYSTORE }}" | base64 -d > /tmp/xed.keystore
          else
            touch /tmp/xed.keystore
          fi

      - name: Decode and create signing.properties
        run: |
          if [ -n "${{ secrets.PROP }}" ]; then
            echo "${{ secrets.PROP }}" | base64 -d > /tmp/signing.properties
          else
            touch /tmp/signing.properties
          fi

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Set Commit Hash
        id: commit_hash
        run: echo "COMMIT_HASH=$(git rev-parse --short HEAD)" >> $GITHUB_ENV

      - name: Generate changelog
        shell: bash
        run: |
          {
            echo "## ReTerminal Release"
            echo ""
            echo "- Commit: $GITHUB_SHA"
            echo "- Branch: ${GITHUB_REF_NAME}"
            echo "- Author: ${GITHUB_ACTOR}"
            echo ""
            echo "## Changelog"
            echo ""
            LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || true)
            if [ -n "$LAST_TAG" ]; then
              echo "### Changes since $LAST_TAG"
              git log "$LAST_TAG..HEAD" --pretty=format:"- %s (%an)" || git log -n 20 --pretty=format:"- %s (%an)"
            else
              echo "### Recent commits"
              git log -n 20 --pretty=format:"- %s (%an)"
            fi
          } > changelog.md

      - name: Build with Gradle
        run: ./gradlew assembleRelease && mv app/build/outputs/apk/release/*.apk app/reterminal-${{ env.COMMIT_HASH }}.apk
        env:
          KEYSTORE_FILE: /tmp/xed.keystore
          SIGNING_PROPERTIES_FILE: /tmp/signing.properties
        continue-on-error: false

      - name: Archive APK
        uses: actions/upload-artifact@v4
        with:
          name: ReTerminal-Release
          path: app/reterminal-${{ env.COMMIT_HASH }}.apk

      - name: Delete xed.keystore and signing.properties
        run: rm -f /tmp/xed.keystore /tmp/signing.properties

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.COMMIT_HASH }}
          name: ReTerminal ${{ env.COMMIT_HASH }}
          body_path: changelog.md
          draft: false
          prerelease: false
          files: app/reterminal-${{ env.COMMIT_HASH }}.apk
