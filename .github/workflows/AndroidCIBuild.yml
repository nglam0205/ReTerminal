name: Build and Release ReTerminal

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      build_id:
        description: Build ID for this release
        required: true
        default: "manual"
      version_name:
        description: App version name
        required: false
        default: "1.3.0"
      prerelease:
        description: Mark as prerelease
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Create local.properties
        run: echo "sdk.dir=${ANDROID_SDK_ROOT}" > local.properties

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Upload debug APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: reterminal-debug-${{ github.run_number }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  release:
    name: Release APK
    needs: build
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    env:
      BUILD_ID: ${{ github.event.inputs.build_id }}
      VERSION_NAME: ${{ github.event.inputs.version_name }}
      RELEASE_TAG: v${{ github.event.inputs.version_name }}-build-${{ github.event.inputs.build_id }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Create local.properties
        run: echo "sdk.dir=${ANDROID_SDK_ROOT}" > local.properties

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Generate changelog
        shell: bash
        run: |
          {
            echo "## ReTerminal Release"
            echo ""
            echo "- Build ID: $BUILD_ID"
            echo "- Version: $VERSION_NAME"
            echo ""
            echo "## Changelog"
            echo ""
            LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || true)
            if [ -n "$LAST_TAG" ]; then
              echo "### Changes since $LAST_TAG"
              git log "$LAST_TAG..HEAD" --pretty=format:"- %s (%an)" || git log -n 20 --pretty=format:"- %s (%an)"
            else
              echo "### Recent commits"
              git log -n 20 --pretty=format:"- %s (%an)"
            fi
          } > changelog.md

      - name: Build release APK
        run: ./gradlew assembleRelease

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: reterminal-release-${{ env.BUILD_ID }}
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ReTerminal ${{ env.VERSION_NAME }} (Build ${{ env.BUILD_ID }})
          body_path: changelog.md
          generate_release_notes: true
          draft: false
          prerelease: ${{ github.event.inputs.prerelease }}
          files: app/build/outputs/apk/release/*.apk
